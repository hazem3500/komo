name: publish
# Every merge to main that touches the package ships it to npm.
# - If packages/komo/package.json has a version that isn't on npm yet (a manual
#   minor/major bump in the PR), that version is published.
# - Otherwise the patch version is bumped, committed back to main, and published.
# Publishing uses npm trusted publishing (OIDC): no npm token is stored here.
on:
  push:
    branches: [main]
    paths: ["packages/komo/**", "pnpm-lock.yaml", ".github/workflows/publish.yml"]
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
jobs:
  # The suite is split across parallel shards; publishing waits for all of them.
  test:
    if: ${{ !startsWith(github.event.head_commit.message, 'Release @hazem3500/komo') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @hazem3500/komo run build:setup
      - run: pnpm --filter @hazem3500/komo exec vitest run --config vitest.config.ts --shard=${{ matrix.shard }}/6
  publish:
    needs: test
    # The release commit below touches package.json; don't publish again for it.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release @hazem3500/komo') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm size
      - name: Choose the version
        id: version
        working-directory: packages/komo
        run: |
          name=$(node -p "require('./package.json').name")
          current=$(node -p "require('./package.json').version")
          if npm view "$name@$current" version >/dev/null 2>&1; then
            # Next patch after whichever is newer, this file or npm's latest, so a
            # release whose bump commit failed to push is never republished.
            latest=$(npm view "$name" version 2>/dev/null || echo 0.0.0)
            next=$(node -e '
              const parse = (v) => v.split(".").map(Number);
              const [a, b] = process.argv.slice(1).map(parse);
              const i = a.findIndex((n, k) => n !== b[k]);
              const [major, minor, patch] = i >= 0 && b[i] > a[i] ? b : a;
              console.log(`${major}.${minor}.${patch + 1}`);
            ' "$current" "$latest")
            npm version "$next" --no-git-tag-version >/dev/null
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Trusted publishing (OIDC) when configured on npmjs.com; otherwise the
      # NPM_TOKEN repository secret, if set.
      - run: npm publish --access public --provenance
        working-directory: packages/komo
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Commit the version bump
        if: steps.version.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other merges may land while this run publishes. Rebuild the bump on the
          # latest main (never older than what was published), retrying on a race.
          git checkout -- packages/komo/package.json
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -f -B release-bump origin/main
            current=$(node -p "require('./packages/komo/package.json').version")
            newer=$(node -e 'const [a,b]=process.argv.slice(1).map(v=>v.split(".").map(Number));const i=a.findIndex((n,k)=>n!==b[k]);console.log(i>=0&&b[i]>a[i]?"yes":"no")' "$current" "$VERSION")
            [ "$newer" = yes ] || exit 0
            (cd packages/komo && npm version "$VERSION" --no-git-tag-version >/dev/null)
            # Only the version file: build output must never be committed.
            git add packages/komo/package.json
            git commit -m "Release @hazem3500/komo $VERSION"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
      - name: Tag the release
        run: |
          # Tag the exact source published to npm, even if main advanced.
          git tag "v${{ steps.version.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ steps.version.outputs.version }}"
