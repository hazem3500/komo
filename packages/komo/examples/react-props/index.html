<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>komo · React props preview</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // ?react=18 loads the React 18 build of the same demo.
      const bundle = new URLSearchParams(location.search).get("react") === "18" ? "./.generated/react-props-18.js" : "./.generated/react-props.js";
      const script = Object.assign(document.createElement("script"), { type: "module", src: bundle });
      script.dataset.bundle = bundle;
      document.head.append(script);
    </script>
  </body>
</html>
